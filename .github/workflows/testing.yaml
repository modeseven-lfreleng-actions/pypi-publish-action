# SPDX-FileCopyrightText: 2025 The Linux Foundation

# Action test/validation workflow
name: 'Test GitHub Action 🧪'

# yamllint disable-line rule:truthy
on:
  workflow_dispatch:
  # Cannot be tested on pull request; secrets not available
  push:
    branches: ['main']

concurrency:
  group: "${{ github.workflow }}"
  cancel-in-progress: true

permissions: {}

env:
  tag: '0.0.1-dev0'

jobs:
  ### Test the GitHub Action in this Repository ###
  tests:
    name: 'Test local GitHub Action'
    runs-on: ubuntu-24.04
    # Run this job in a dedicated environment so its execution and any
    # environment-scoped secrets can be gated by environment protection
    # rules (satisfies zizmor's secrets-outside-env).
    environment: 'development'
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      # Harden the runner used by this workflow
      # yamllint disable-line rule:line-length
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: 'Checkout repository'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Perform setup prior to running test(s)
      - name: 'Checkout sample project repository'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: "lfreleng-actions/test-python-project"
          path: 'test-python-project'
          persist-credentials: false

      - name: 'Build Python project'
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/python-build-action@3cdb6f8e3b9c6c8fb21cce123f7b873b3620273d # v2.1.1
        with:
          tag: "${{ env.tag }}"
          path_prefix: 'test-python-project'

      - name: "Running local action: ${{ github.repository }}"
        uses: $/
        with:
          path_prefix: 'test-python-project'
          tag: "${{ env.tag }}"
          no_checkout: true
          op_service_account_token: "${{ secrets.op_service_account_token }}"
          one_password_item: "${{ vars.one_password_item }}"
          pypi_credential: "${{ secrets.pypi_credential }}"
          publish_disable: true
